name: Contentful rebuild

on:
  repository_dispatch:
    types: [contentful-publish]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contentful-rebuild
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "contentful-bot"
          git config user.email "contentful-bot@users.noreply.github.com"

      - name: Touch rebuild marker to force Vercel rebuild
        run: |
          mkdir -p apps/web/src/generated
          date -u +%Y-%m-%dT%H:%M:%SZ > apps/web/src/generated/last-rebuild.txt
          git add apps/web/src/generated/last-rebuild.txt
          git commit -m "chore: rebuild from contentful publish [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push origin HEAD:main
